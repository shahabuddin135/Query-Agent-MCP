[project]
name = "query-agent-mcp"
version = "1.0.0"
description = "MCP server for Neon task management with 10 tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette",
]

[project.scripts]
query-agent-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
